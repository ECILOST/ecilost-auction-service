name: SonarQube Cloud

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage
      - name: Verify analysis inputs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Configure the SONAR_TOKEN GitHub Actions secret."
            exit 1
          fi
          test -s coverage/lcov.info
      - name: Analyze and wait for the Quality Gate
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
