name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to deploy to PROD (sha-<40 character commit SHA>)
        required: true
        type: string

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    # PostgreSQL real para las pruebas de integracion: concurrencia de pujas, anti-sniping,
    # ciclo de vida y motor automatico dependen de bloqueos y del reloj de la base.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: ecilost_auction
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U auction -d ecilost_auction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test --if-present
      - name: Integration tests (PostgreSQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://auction:auction@localhost:5436/ecilost_auction?schema=auction_it
      - name: Build
        run: npm run build

  # Imagenes en GitHub Container Registry (gratis para paquetes publicos) en lugar de ACR.
  publish-image:
    if: github.event_name == 'push'
    needs: node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ecilost/ecilost-auction-service
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cada push a develop despliega en DEV la imagen inmutable de ese commit. Antes de cambiar la
  # imagen aplica las migraciones pendientes: sin eso, el codigo nuevo arrancaba sin sus tablas.
  deploy-dev:
    if: github.event_name == 'push' && github.ref_name == 'develop' && vars.DEV_CONTAINER_APP_NAME != ''
    needs: publish-image
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.DEV_CONTAINER_APP_NAME }}
      IMAGE: ghcr.io/ecilost/ecilost-auction-service:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Solo hace falta la CLI de Prisma y las migraciones: sin scripts ni cliente generado.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # La URL de la base sale del secreto de la propia Container App y se oculta en el log.
      - name: Apply database migrations
        run: |
          DATABASE_URL="$(az containerapp secret show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --secret-name database-url --query value -o tsv)"
          [ -n "$DATABASE_URL" ] || { echo "::error::No se pudo leer el secreto database-url de $APP_NAME"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npx prisma migrate deploy
      - name: Deploy immutable image to DEV
        run: az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
      - name: Verify deployed image
        run: |
          deployed="$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          state="$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.provisioningState' -o tsv)"
          echo "Imagen desplegada: $deployed ($state)"
          [ "$deployed" = "$IMAGE" ] && [ "$state" = "Succeeded" ] || { echo "::error::DEV no quedo con $IMAGE"; exit 1; }

  # Cada push a main despliega en PROD la imagen inmutable de ese commit, con sus migraciones.
  # A mano (workflow_dispatch) se puede volver a una imagen anterior: sha-<commit>.
  deploy-prod:
    if: >-
      !cancelled() && github.ref_name == 'main' && vars.PROD_CONTAINER_APP_NAME != '' &&
      needs.node.result == 'success' &&
      ((github.event_name == 'push' && needs.publish-image.result == 'success') || github.event_name == 'workflow_dispatch')
    needs: [node, publish-image]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.PROD_CONTAINER_APP_NAME }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('sha-{0}', github.sha) }}
    steps:
      - name: Validate image tag
        run: '[[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "Use an immutable sha-<40 character commit SHA> tag"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply database migrations
        run: |
          DATABASE_URL="$(az containerapp secret show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --secret-name database-url --query value -o tsv)"
          [ -n "$DATABASE_URL" ] || { echo "::error::No se pudo leer el secreto database-url de $APP_NAME"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npx prisma migrate deploy
      - name: Deploy immutable image to PROD
        run: az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "ghcr.io/ecilost/ecilost-auction-service:$IMAGE_TAG"
      - name: Verify deployed image
        run: |
          deployed="$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          state="$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.provisioningState' -o tsv)"
          echo "Imagen desplegada: $deployed ($state)"
          [ "$deployed" = "ghcr.io/ecilost/ecilost-auction-service:$IMAGE_TAG" ] && [ "$state" = "Succeeded" ] || { echo "::error::PROD no quedo con $IMAGE_TAG"; exit 1; }
